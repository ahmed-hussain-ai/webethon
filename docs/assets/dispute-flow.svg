ext x="34" y="42" text-anchor="middle" class="m" font-size="16" font-weight="800" fill="#fff">3</text><text x="62" y="42" class="m" font-size="13" font-weight="800" letter-spacing="2" fill="#A7F0E6">DECIDE</text><text x="18" y="96" class="f" font-size="14" fill="#F2F7F6">Accept with a new mark</text><text x="18" y="120" class="f" font-size="14" fill="#9DB4B1">or reject, with a reason</text></g><path class="flow" d="M698 155 H724" stroke="#2BC4B6" stroke-width="2.5" fill="none"/><g transform="translate(726 70)"><rect width="200" height="170" rx="18" fill="#fff" fill-opacity=".04" stroke="#F7C948" stroke-opacity=".35"/><circle cx="34" cy="36" r="18" fill="url(#g)"/><text x="34" y="42" text-anchor="middle" class="m" font-size="16" font-weight="800" fill="#fff">4</text><text x="62" y="42" class="m" font-size="13" font-weight="800" letter-spacing="2" fill="#F7C948">FAIR TO ALL</text><text x="18" y="96" class="f" font-size="14" fill="#F2F7F6">Apply to every candidate:</text><text x="18" y="120" class="f" font-size="14" fill="#9DB4B1">raises, never lowers</text></g><path class="flow" d="M928 155 H954" stroke="#2BC4B6" stroke-width="2.5" fill="none"/><g transform="translate(956 70)"><rect width="200" height="170" rx="18" fill="#fff" fill-opacity=".04" stroke="#2BC4B6" stroke-opacity=".35"/><circle cx="34" cy="36" r="18" fill="url(#g)"/><text x="34" y="42" text-anchor="middle" class="m" font-size="16" font-weight="800" fill="#fff">5</text><text x="62" y="42" class="m" font-size="13" font-weight="800" letter-spacing="2" fill="#A7F0E6">PROVE IT</text><text x="18" y="96" class="f" font-size="14" fill="#F2F7F6">Append-only audit log;</text><text x="18" y="120" class="f" font-size="14" fill="#9DB4B1">old PDF shows superseded</text></g><text x="36" y="44" class="m" font-size="12.5" letter-spacing="3" fill="#9DB4B1">AFTER RESULTS ARE PUBLISHED, MARKS CAN CHANGE ONLY THROUGH THIS PATH · ENFORCED BY A DATABASE TRIGGER</text></svg>