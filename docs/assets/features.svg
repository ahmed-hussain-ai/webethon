font-weight="800" fill="#F2F7F6">Frozen paper</text><text x="20" y="118" class="f" font-size="13.5" fill="#9DB4B1">Each candidate's questions,</text><text x="20" y="137" class="f" font-size="13.5" fill="#9DB4B1">options and marks are</text><text x="20" y="156" class="f" font-size="13.5" fill="#9DB4B1">snapshotted at start.</text></g><g transform="translate(890 32)"><rect width="270" height="172" rx="18" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".09"/><rect x="20" y="20" width="44" height="44" rx="12" fill="url(#g)" fill-opacity=".9"/><text x="42" y="50" text-anchor="middle" font-size="22">🤖</text><text x="20" y="92" class="f" font-size="17" font-weight="800" fill="#F2F7F6">AI-assisted marking</text><text x="20" y="118" class="f" font-size="13.5" fill="#9DB4B1">Written answers vs the</text><text x="20" y="137" class="f" font-size="13.5" fill="#9DB4B1">examiner's answer, fixed</text><text x="20" y="156" class="f" font-size="13.5" fill="#9DB4B1">rubric, injection flagged.</text></g><g transform="translate(32 222)"><rect width="270" height="172" rx="18" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".09"/><rect x="20" y="20" width="44" height="44" rx="12" fill="url(#g)" fill-opacity=".9"/><text x="42" y="50" text-anchor="middle" font-size="22">⚖️</text><text x="20" y="92" class="f" font-size="17" font-weight="800" fill="#F2F7F6">Disputes &amp; audit</text><text x="20" y="118" class="f" font-size="13.5" fill="#9DB4B1">Accept or reject with a</text><text x="20" y="137" class="f" font-size="13.5" fill="#9DB4B1">response; apply-to-all never</text><text x="20" y="156" class="f" font-size="13.5" fill="#9DB4B1">lowers a mark.</text></g><g transform="translate(318 222)"><rect width="270" height="172" rx="18" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".09"/><rect x="20" y="20" width="44" height="44" rx="12" fill="url(#g)" fill-opacity=".9"/><text x="42" y="50" text-anchor="middle" font-size="22">✅</text><text x="20" y="92" class="f" font-size="17" font-weight="800" fill="#F2F7F6">Verifiable reports</text><text x="20" y="118" class="f" font-size="13.5" fill="#9DB4B1">PDF with code + QR; public</text><text x="20" y="137" class="f" font-size="13.5" fill="#9DB4B1">/verify shows a masked name;</text><text x="20" y="156" class="f" font-size="13.5" fill="#9DB4B1">superseded on change.</text></g><g transform="translate(604 222)"><rect width="270" height="172" rx="18" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".09"/><rect x="20" y="20" width="44" height="44" rx="12" fill="url(#g)" fill-opacity=".9"/><text x="42" y="50" text-anchor="middle" font-size="22">📡</text><text x="20" y="92" class="f" font-size="17" font-weight="800" fill="#F2F7F6">Live monitoring</text><text x="20" y="118" class="f" font-size="13.5" fill="#9DB4B1">Progress, time left, incidents</text><text x="20" y="137" class="f" font-size="13.5" fill="#9DB4B1">with note/dismiss, live</text><text x="20" y="156" class="f" font-size="13.5" fill="#9DB4B1">announcements.</text></g><g transform="translate(890 222)"><rect width="270" height="172" rx="18" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".09"/><rect x="20" y="20" width="44" height="44" rx="12" fill="url(#g)" fill-opacity=".9"/><text x="42" y="50" text-anchor="middle" font-size="22">🎨</text><text x="20" y="92" class="f" font-size="17" font-weight="800" fill="#F2F7F6">Accessible workspace</text><text x="20" y="118" class="f" font-size="13.5" fill="#9DB4B1">Light/dark, high contrast, text</text><text x="20" y="137" class="f" font-size="13.5" fill="#9DB4B1">size, split view with</text><text x="20" y="156" class="f" font-size="13.5" fill="#9DB4B1">scratchpad.</text></g></svg>